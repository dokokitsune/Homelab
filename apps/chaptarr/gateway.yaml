apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaptarr
  namespace: chaptarr
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: apps
      namespace: gateways
      sectionName: https
  hostnames:
    - chaptarr.home.dokocloud.net
  rules:
    - backendRefs:
        - name: chaptarr
          port: 8789
