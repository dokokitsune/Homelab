apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: private-gateways
spec:
  serviceSelector:
    matchExpressions:
      - key: homelab/exposure
        operator: In
        values:
          - apps
          - telemetry
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  loadBalancerIPs: true
  interfaces:
    - "^(en|eth).*"
