apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.8.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
    domain: cluster.local
  kustomize:
    patches:
      - target:
          kind: Namespace
          name: flux-system
        patch: |
          - op: add
            path: /metadata/labels/homelab~1gateway-apps
            value: "true"
  sync:
    kind: GitRepository
    url: https://github.com/dokokitsune/Homelab.git
    ref: refs/heads/main
    path: clusters/base
    pullSecret: flux-system
